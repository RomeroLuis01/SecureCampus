services:
  db:
    image: postgres:16
    command: [ "postgres", "-c", "timezone=America/Mexico_City" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: securecampus
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LECTURA_DB_PASSWORD: ${LECTURA_DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # solo accesible desde tu equipo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seeds:/seeds:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d securecampus" ]
      interval: 5s
      retries: 10
    networks:
      - securecampus-network

  migrate:
    # corre las migraciones y termina
    image: ghcr.io/amacneil/dbmate
    command: [ "--no-dump-schema", "up" ]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/securecampus?sslmode=disable
    volumes:
      - ./db:/db
    depends_on:
      db: { condition: service_healthy }
    networks:
      - securecampus-network

  adminer:
    # visor web, opcional
    image: adminer
    profiles: [ "tools" ]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - securecampus-network

volumes:
  pgdata:

networks:
  securecampus-network:
    driver: bridge
